<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Champion's Gauntlet — Art Test</title><style>html,body{margin:0;min-height:100%;background:#10201d;color:#e9e3d0;font-family:Georgia,serif}main{min-height:100vh;display:grid;place-items:center;text-align:center}b{font-size:18px;color:#d9a441}small{display:block;margin-top:8px;color:#a9b0a0}</style><main><div><b>Loading Champion's Gauntlet…</b><small>Opening the playable art test.</small></div></main><script>(async()=>{const r=await fetch('./champion-source.html',{cache:'no-store'});if(!r.ok)throw Error('Could not load test source ('+r.status+')');let h=await r.text();h=h.replace("fetch('./index.html'","fetch('./base.html'");document.open();document.write(h);document.close()})().catch(e=>{document.querySelector('main').innerHTML='<div><b>Test build failed to load.</b><small>'+String(e.message||e)+'</small></div>';console.error(e)});</script>
