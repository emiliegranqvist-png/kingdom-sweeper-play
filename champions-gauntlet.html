<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Champion's Gauntlet — Kingdom Sweeper</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10201d}
iframe{display:block;width:100%;height:100%;border:0}
#status{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:5;padding:8px 14px;border:1px solid #d9a441;border-radius:8px;background:#102420;color:#e9e3d0;font:14px Georgia,serif;box-shadow:0 4px 14px #0008;pointer-events:none;transition:opacity .3s}
</style>
</head>
<body>
<div id="status">Loading Champion's Gauntlet…</div>
<iframe id="game" src="./index.html" title="Kingdom Sweeper"></iframe>
<script>
(() => {
  const frame=document.getElementById('game');
  const status=document.getElementById('status');
  frame.addEventListener('load',()=>{
    const doc=frame.contentDocument;
    if(!doc)return;
    const patch=doc.createElement('script');
    patch.textContent=`(() => {
      const level=TRAINING.find(l=>l.id==='train-champion');
      if(!level)throw new Error('Champion level not found');
      const stone=[];
      for(let r=0;r<16;r++)for(let c=0;c<30;c++){
        if(r<2||r>=14||c<2||c>=28||r===7||r===8||c===14||c===15)stone.push([r,c]);
      }
      level.stoneTiles=stone;
      window.__championPatternReady=true;
    })();`;
    doc.body.appendChild(patch);

    let tries=0;
    const openLevel=()=>{
      tries++;
      const clickable=[...doc.querySelectorAll('button,.lvl-card,[role="button"]')];
      const champion=clickable.find(el=>/Champion['’]s Gauntlet/i.test(el.textContent||''));
      if(champion){champion.click();status.style.opacity='0';setTimeout(()=>status.remove(),350);return;}
      const training=clickable.find(el=>/Training/i.test(el.textContent||''));
      if(training)training.click();
      if(tries<30)setTimeout(openLevel,150);
      else status.textContent="Open Training Grounds, then Champion's Gauntlet.";
    };
    setTimeout(openLevel,100);
  });
})();
</script>
</body>
</html>
