<script>
(async()=>{
  const response=await fetch('./index.html',{cache:'no-store'});
  if(!response.ok)throw new Error('Could not load index.html ('+response.status+')');
  let html=await response.text();
  const needle='const LEVEL_ICONS=';
  if(!html.includes(needle))throw new Error('The current build no longer contains the expected level hook.');
  const patch="(function(){\n  const lv=(KS_LEVEL_DATA.training||[]).find(x=>x.id==='train-champion');\n  if(!lv)return;\n  const COLS=30,ROWS=16,CELL=42,GAP=3,STEP=CELL+GAP,GW=COLS*STEP-GAP,GH=ROWS*STEP-GAP;\n  const C={ink:'#18251a',grass:'#659946',grassHi:'#80b45b',grassLo:'#456f35',dirt:'#b58a4d',dirtHi:'#c9a366',dirtLo:'#856332',stone:'#d8d0b4',stoneHi:'#eee8d2',stoneLo:'#aaa184',blue:'#245b9b',blueHi:'#4b82c4',blueLo:'#163e72',gold:'#c89a38',goldHi:'#e7c565',wood:'#80552c',woodHi:'#b07a3e',woodLo:'#4b301b',rope:'#d8bd71',metal:'#d5d7d2',shadow:'rgba(12,18,14,.45)'};\n  function rng(seed){let a=seed|0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}\n  function tile(kind,seed){const cv=document.createElement('canvas');cv.width=cv.height=42;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;const R=rng(seed);\n    let base=C.grass,hi=C.grassHi,lo=C.grassLo;\n    if(kind==='dirt'){base=C.dirt;hi=C.dirtHi;lo=C.dirtLo;}else if(kind!=='grass'){base=C.stone;hi=C.stoneHi;lo=C.stoneLo;}\n    x.fillStyle=base;x.fillRect(0,0,42,42);\n    for(let i=0;i<70;i++){const px=(R()*40|0)+1,py=(R()*40|0)+1,w=1+(R()*3|0),h=1+(R()*2|0);x.fillStyle=R()>.48?hi:lo;x.globalAlpha=.22+R()*.3;x.fillRect(px,py,w,h);}x.globalAlpha=1;\n    if(kind==='grass'){for(let i=0;i<8;i++){const px=4+(R()*34|0),py=7+(R()*30|0);x.fillStyle=R()>.5?C.grassHi:C.grassLo;x.fillRect(px,py,1,4);x.fillRect(px+1,py-1,1,3);}}\n    if(kind==='dirt'){for(let i=0;i<8;i++){const px=3+(R()*36|0),py=4+(R()*34|0);x.fillStyle=C.dirtLo;x.fillRect(px,py,2,1);}}\n    if(kind==='stone'||kind==='gem'||kind==='ornate'){x.strokeStyle='#8f876f';x.lineWidth=1;x.strokeRect(.5,.5,41,41);x.fillStyle='#f2edda';x.globalAlpha=.3;x.fillRect(2,2,38,2);x.globalAlpha=1;\n      x.strokeStyle='#a59c80';x.beginPath();x.moveTo(5,26);x.lineTo(13,24);x.lineTo(16,28);x.moveTo(29,8);x.lineTo(25,14);x.lineTo(31,18);x.stroke();}\n    if(kind==='gem'){x.fillStyle=C.gold;x.beginPath();x.moveTo(21,7);x.lineTo(35,21);x.lineTo(21,35);x.lineTo(7,21);x.closePath();x.fill();x.fillStyle=C.blueLo;x.beginPath();x.moveTo(21,10);x.lineTo(32,21);x.lineTo(21,32);x.lineTo(10,21);x.closePath();x.fill();x.fillStyle=C.blueHi;x.beginPath();x.moveTo(21,12);x.lineTo(21,29);x.lineTo(12,21);x.closePath();x.fill();x.fillStyle='#8fc3e5';x.fillRect(16,16,4,4);}\n    if(kind==='ornate'){x.fillStyle=C.gold;[[3,3],[33,3],[3,33],[33,33]].forEach(p=>x.fillRect(p[0],p[1],6,6));x.fillStyle=C.blue;[[5,5],[35,5],[5,35],[35,35]].forEach(p=>x.fillRect(p[0],p[1],2,2));x.strokeStyle=C.gold;x.strokeRect(6.5,6.5,29,29);x.strokeStyle=C.blue;x.strokeRect(9.5,9.5,23,23);}\n    return cv.toDataURL('image/png');}\n  function overlay(){const cv=document.createElement('canvas');cv.width=GW;cv.height=GH;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;\n    function rr(px,py,w,h,c){x.fillStyle=c;x.fillRect(Math.round(px),Math.round(py),Math.round(w),Math.round(h));}\n    function post(px,py){rr(px-6,py-5,12,11,C.woodLo);rr(px-5,py-12,10,14,C.wood);rr(px-3,py-13,6,4,C.woodHi);rr(px-6,py+4,12,3,'rgba(0,0,0,.28)');}\n    function rope(x1,y1,x2,y2){x.strokeStyle=C.rope;x.lineWidth=4;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.strokeStyle='#8d6b32';x.lineWidth=1;x.setLineDash([5,4]);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.setLineDash([]);}\n    function dummy(cx,cy){rr(cx-5,cy-22,10,14,C.woodLo);rr(cx-7,cy-20,14,18,C.wood);rr(cx-5,cy-18,5,6,C.woodHi);rr(cx-18,cy-9,36,6,C.woodLo);rr(cx-16,cy-8,32,4,C.wood);rr(cx-9,cy-2,18,28,C.wood);rr(cx-5,cy,5,22,C.woodHi);rr(cx-14,cy+25,28,6,C.woodLo);rr(cx-10,cy+24,20,5,C.wood);rr(cx-13,cy+31,26,4,'rgba(0,0,0,.25)');}\n    function ring(c0,r0,wc,hr){const x0=c0*STEP+9,y0=r0*STEP+7,x1=(c0+wc)*STEP-10,y1=(r0+hr)*STEP-8;rope(x0,y0,x1,y0);rope(x1,y0,x1,y1);rope(x1,y1,x0,y1);rope(x0,y1,x0,y0);[[x0,y0],[x1,y0],[x0,y1],[x1,y1],[(x0+x1)/2,y0],[(x0+x1)/2,y1]].forEach(p=>post(p[0],p[1]));dummy(x0+(x1-x0)*.38,y0+(y1-y0)*.42);dummy(x0+(x1-x0)*.66,y0+(y1-y0)*.64);}\n    function rack(cx,cy){rr(cx-34,cy+12,68,8,C.woodLo);rr(cx-32,cy+9,64,7,C.wood);rr(cx-28,cy-7,6,23,C.woodLo);rr(cx+22,cy-7,6,23,C.woodLo);for(let i=-2;i<=2;i++){const px=cx+i*12;rr(px-1,cy-35,3,45,C.metal);rr(px-3,cy-38,7,7,C.metal);rr(px-2,cy-42,5,6,'#f1f0e8');rr(px-1,cy-30,2,3,C.blue);}}\n    function gate(cx,cy){rr(cx-86,cy-19,172,38,'rgba(0,0,0,.25)');rr(cx-82,cy-25,164,34,C.stoneLo);rr(cx-75,cy-21,150,27,C.stone);rr(cx-65,cy-18,130,20,C.blue);rr(cx-60,cy-15,120,4,C.blueHi);rr(cx-88,cy-28,20,42,C.gold);rr(cx+68,cy-28,20,42,C.gold);rr(cx-83,cy-23,10,30,C.stoneHi);rr(cx+73,cy-23,10,30,C.stoneHi);x.fillStyle=C.gold;x.beginPath();x.moveTo(cx,cy-28);x.lineTo(cx+19,cy-17);x.lineTo(cx+15,cy+8);x.lineTo(cx,cy+20);x.lineTo(cx-15,cy+8);x.lineTo(cx-19,cy-17);x.closePath();x.fill();x.fillStyle=C.blueLo;x.beginPath();x.moveTo(cx,cy-23);x.lineTo(cx+14,cy-14);x.lineTo(cx+11,cy+5);x.lineTo(cx,cy+14);x.lineTo(cx-11,cy+5);x.lineTo(cx-14,cy-14);x.closePath();x.fill();rr(cx-2,cy-15,4,20,C.gold);rr(cx-9,cy-8,18,4,C.gold);}\n    function pylon(cx,cy){rr(cx-12,cy-15,24,30,C.stoneLo);rr(cx-9,cy-20,18,32,C.stone);rr(cx-6,cy-17,12,20,C.blue);rr(cx-4,cy-15,8,4,C.blueHi);rr(cx-2,cy-10,4,12,C.gold);rr(cx-6,cy-6,12,4,C.gold);rr(cx-13,cy+12,26,5,'rgba(0,0,0,.25)');}\n    ring(3,5,7,4);ring(20,5,7,4);\n    rack(3*STEP+CELL/2,3*STEP+CELL/2);rack(26*STEP+CELL/2,3*STEP+CELL/2);rack(3*STEP+CELL/2,12*STEP+CELL/2);rack(26*STEP+CELL/2,12*STEP+CELL/2);\n    gate(GW/2,32);gate(GW/2,GH-31);\n    [[1,1],[28,1],[1,14],[28,14],[14,7],[15,8]].forEach(p=>pylon(p[0]*STEP+CELL/2,p[1]*STEP+CELL/2));\n    return cv.toDataURL('image/png');}\n  function background(){const W=1448,H=1086,lo=document.createElement('canvas');lo.width=W/2;lo.height=H/2;const x=lo.getContext('2d'),R=rng(77123);x.imageSmoothingEnabled=false;const S=2;\n    function rr(px,py,w,h,c){x.fillStyle=c;x.fillRect(px/S,py/S,w/S,h/S);}function poly(points,c){x.fillStyle=c;x.beginPath();points.forEach((p,i)=>{const a=p[0]/S,b=p[1]/S;i?x.lineTo(a,b):x.moveTo(a,b)});x.closePath();x.fill();}\n    rr(0,0,W,H,'#a9854e');\n    for(let i=0;i<4200;i++){const px=R()*W,py=R()*H;const edge=Math.min(px,W-px,py,H-py);if(edge>190&&R()>.26)continue;rr(px,py,2+(R()*5|0),2+(R()*3|0),R()>.55?'rgba(72,103,46,.34)':'rgba(226,196,126,.16)');}\n    rr(0,0,W,138,'#55584f');rr(0,0,W,18,'#272d29');rr(0,112,W,28,'#373b35');\n    for(let row=0;row<4;row++)for(let c=0;c<30;c++){const bx=c*52+(row%2)*24,by=20+row*24;rr(bx,by,48,20,row%2?'#67685e':'#727268');rr(bx,by+18,48,2,'#393d37');rr(bx+3,by+3,16,2,'rgba(255,255,255,.08)');}\n    for(let c=0;c<17;c++){const ax=38+c*82;rr(ax,22,58,65,'#353a35');rr(ax+6,30,46,48,'#1d2421');poly([[ax+6,42],[ax+29,23],[ax+52,42]],'#4d514a');for(let n=0;n<10;n++){const px=ax+10+R()*38,py=50+R()*22;rr(px,py,3,5,R()>.6?'#2f557e':R()>.3?'#6e4930':'#20251f');}}\n    poly([[0,100],[155,132],[178,890],[0,965]],'#55584f');poly([[W,100],[W-155,132],[W-178,890],[W,965]],'#55584f');\n    for(let y=150;y<900;y+=36){rr(0,y,150,28,y%72?'#67685e':'#73736a');rr(W-150,y,150,28,y%72?'#67685e':'#73736a');for(let c=0;c<5;c++){rr(c*32+(y%72?12:0),y+25,30,3,'#343832');rr(W-150+c*32+(y%72?12:0),y+25,30,3,'#343832');}}\n    rr(0,938,W,148,'#454a44');rr(0,936,W,24,'#707269');for(let c=0;c<29;c++){rr(c*52,960,48,34,c%2?'#5e615a':'#686b63');rr(c*52,990,48,3,'#30352f');}\n    rr(W/2-165,44,330,118,'#3c423d');rr(W/2-145,28,290,122,'#666960');rr(W/2-125,42,250,104,'#7b7b70');rr(W/2-72,70,144,82,'#2c322e');poly([[W/2-72,94],[W/2,38],[W/2+72,94]],'#555b55');rr(W/2-48,94,96,58,'#171d1b');\n    rr(W/2-118,48,48,80,C.blue);rr(W/2+70,48,48,80,C.blue);rr(W/2-112,52,36,8,C.blueHi);rr(W/2+76,52,36,8,C.blueHi);rr(W/2-6,44,12,42,C.gold);rr(W/2-24,60,48,10,C.gold);\n    function torch(cx,cy){rr(cx-10,cy,20,42,'#4d3a25');rr(cx-14,cy+34,28,12,'#2a2e29');rr(cx-6,cy-10,12,18,'#ff9b28');rr(cx-3,cy-16,6,14,'#ffd45e');rr(cx-18,cy-20,36,40,'rgba(255,164,55,.12)');}\n    torch(W/2-190,120);torch(W/2+190,120);torch(310,970);torch(W-310,970);\n    function tent(cx,cy){poly([[cx-76,cy+70],[cx,cy-42],[cx+76,cy+70]],'#e6dfc5');poly([[cx,cy-42],[cx+76,cy+70],[cx+18,cy+70]],C.blue);poly([[cx,cy-42],[cx-76,cy+70],[cx-18,cy+70]],'#f0ead6');rr(cx-76,cy+68,152,12,C.blueLo);for(let k=-2;k<=2;k++)rr(cx+k*24-3,cy+68,6,12,C.gold);rr(cx-4,cy-56,8,18,C.gold);rr(cx-6,cy+18,12,52,'#2b302c');}\n    tent(92,260);tent(W-92,260);tent(92,790);tent(W-92,790);\n    for(let i=0;i<620;i++){let side=R()<.5?0:1,px=side?W-110-R()*95:15+R()*95,py=145+R()*770;rr(px,py,3+R()*7,3+R()*5,R()>.45?'#4c7636':'#315a2d');if(R()>.9)rr(px+2,py-2,3,3,R()>.5?'#d9d0f0':'#f4df75');}\n    for(let i=0;i<260;i++){const px=160+R()*(W-320),py=(R()<.5?150+R()*55:865+R()*55);rr(px,py,3+R()*5,3+R()*4,R()>.5?'#4f7739':'#365c31');if(R()>.82)rr(px,py-2,3,3,R()>.5?'#d6c5ee':'#eacb62');}\n    function crate(cx,cy){rr(cx,cy,34,30,C.woodLo);rr(cx+3,cy+3,28,24,C.wood);rr(cx+5,cy+5,24,3,C.woodHi);rr(cx+5,cy+18,24,3,C.woodLo);rr(cx+15,cy+3,3,24,C.woodLo);}function barrel(cx,cy){rr(cx,cy,25,38,C.woodLo);rr(cx+3,cy+2,19,34,C.wood);rr(cx,cy+8,25,4,'#343831');rr(cx,cy+26,25,4,'#343831');}\n    crate(190,205);barrel(236,210);crate(W-232,204);barrel(W-278,210);crate(175,820);barrel(225,816);crate(W-225,820);barrel(W-270,816);\n    function statue(cx,cy,flip){rr(cx-24,cy+58,48,18,'#3a3e39');rr(cx-18,cy+18,36,42,'#777970');rr(cx-14,cy-12,28,32,'#85877e');rr(cx-8,cy-28,16,18,'#73766e');rr(cx+(flip?-30:22),cy-2,9,62,'#696c65');rr(cx+(flip?-34:20),cy-12,15,18,'#8a8c84');rr(cx-17,cy+70,34,8,'rgba(0,0,0,.25)');}\n    statue(150,520,false);statue(W-150,520,true);\n    const out=document.createElement('canvas');out.width=W;out.height=H;const o=out.getContext('2d');o.imageSmoothingEnabled=false;o.drawImage(lo,0,0,W,H);return out.toDataURL('image/png');}\n  function stone(r,c){return r<2||r>=14||c<2||c>=28||r===7||r===8||c===14||c===15;}\n  function dirt(r,c){return (r===3||r===12)&&c>=2&&c<=27&&c!==14&&c!==15;}\n  const gem=new Set(['0,0','0,29','15,0','15,29','0,14','0,15','15,14','15,15','7,0','8,0','7,29','8,29','7,14','7,15','8,14','8,15','3,14','3,15','5,14','5,15','10,14','10,15','12,14','12,15']);\n  const ornate=new Set(['0,13','0,16','15,13','15,16','6,14','6,15','9,14','9,15','7,13','8,13','7,16','8,16']);\n  const paint={grass:[],dirt:[],stone:[],gem:[],ornate:[]},stones=[];\n  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=r+','+c;let t=ornate.has(k)?'ornate':gem.has(k)?'gem':stone(r,c)?'stone':dirt(r,c)?'dirt':'grass';paint[t].push([r,c]);if(stone(r,c))stones.push([r,c]);}\n  lv.stoneTiles=stones;lv.customTiles={grass:tile('grass',101),dirt:tile('dirt',202),stone:tile('stone',303),gem:tile('gem',404),ornate:tile('ornate',505)};lv.paintTiles=paint;\n  lv.overlayImage=overlay();lv.overlayFull=true;lv.ovHidden=.94;lv.ovCleared=.58;lv.ovEdge=.04;lv.ovEdge2=.26;\n  lv.borderImage=background();lv.borderWindow=[.085,.20,.83,.60];lv.clearDim={ratio:.24,contrast:1.42,saturate:.22,floor:.035};\n})();\n";

  html=html.replace('</body>',"<script>\n(function(){\n  const go=()=>{const p=document.getElementById('playBtn');if(!p)return setTimeout(go,80);p.click();setTimeout(()=>{const t=document.getElementById('modeTraining');if(!t)return;t.click();setTimeout(()=>{const cards=[...document.querySelectorAll('#trainLevels .lvl-card')];const c=cards.find(x=>x.textContent.includes(\"Champion's Gauntlet\"));if(c)c.click();},120);},100);};\n  if(document.readyState==='complete')setTimeout(go,80);else addEventListener('load',()=>setTimeout(go,80));\n})();\n<\\/script>"+'</body>');
  document.open();document.write(html);document.close();
